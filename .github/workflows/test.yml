# Runs the Q.E.D.! test suite (tests/run.py) in headless Chromium on every push and pull request that changes
# the game, the tests or the tools. It needs no secrets, so it also runs on forks and on pull requests from forks.
# Third-party code: only actions/checkout, pinned to an exact commit; Python is the runner's preinstalled python3.
name: Tests
on:
  push:
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/test.yml']
  pull_request:
    paths: ['src/**', 'tests/**', 'tools/**', '.github/workflows/test.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # a virtual environment, because the runner's system Python refuses pip installs (PEP 668)
      - name: Install Playwright and Chromium
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/venv/bin/python" -m pip install playwright pillow
          "$RUNNER_TEMP/venv/bin/python" -m playwright install --with-deps chromium
      - name: Run the tests
        run: python3 tests/run.py
