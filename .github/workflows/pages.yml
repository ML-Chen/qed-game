# Publishes the game to GitHub Pages: every push to main that changes src/ builds the single-file page and
# force-pushes one commit with index.html to the gh-pages branch. Third-party code: only actions/checkout, pinned.
name: Publish to GitHub Pages
on:
  push:
    branches: [main]
    paths: ['src/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ML-Chen/qed-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the single-file game
        run: python3 src/build.py dist/qed.html
      - name: Push to the gh-pages branch (one commit, replacing the previous one)
        run: |
          mkdir site && cp dist/qed.html site/index.html && touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Q.E.D.! build from ${GITHUB_SHA::7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
